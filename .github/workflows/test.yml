name: Automatic Testing of EQquasi

# Run on master and on pull requests only. Every push to a work-in-progress
# branch previously fired a full run, and every tag fired a second one, so a
# day of ordinary development produced dozens of notification emails. Feature
# branches are covered when they open a PR.
on:
  push:
    branches: [master]
  pull_request:

# A superseded push on the same PR/branch cancels its stale run instead of
# queuing behind it -- otherwise every push during a review burns a full
# ~15-18 min run nobody will read the result of.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags are needed by the version-provenance guard

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install git vim openmpi-bin make cmake
        sudo apt-get install libblas-dev liblapack-dev
        sudo apt-get install python3 python3-pip
        sudo apt-get install libmumps-dev python3-matplotlib
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        pip install xarray imageio pdf2image numpy==1.26.4 netCDF4 pytest matplotlib

    - name: Fast tiers (unit, contract, regression)
      run: python3 -m pytest testsys/ -v

    - name: Build
      run: |
        bash make.scripts.executable.sh
        export EQQUASIROOT=$(pwd)
        bash install.eqquasi.sh -m ubuntu
        # bin/ holds versioned binaries and deliberately no plain `eqquasi`,
        # so the check has to ask src which version it just built. Left as
        # `test -x bin/eqquasi` it fails every run, which is what took CI red
        # from v1.12.0 onward.
        eqv=$(grep -oP "EQQUASI_VERSION = '\K[^']*" src/globalvar.f90)
        test -x "bin/eqquasi-$eqv"

    - name: End-to-end (CI smokes only)
      # Owner decision 2026-09-23 (PATHWAY_FORWARD.md row 9): CI runs only the
      # two 101-step smokes -- test.bp5.qdc.2000 and test.stepover.qdc.1000,
      # the project's only ntotft > 1 case in the gate (rule 12). The rest of
      # e2e_fast (BP8's ~8000-step case, ~13 min alone) and the full e2e tier
      # move to a periodic/local sweep on the 48-64-core hosts instead.
      run: |
        export EQQUASIROOT=$(pwd)
        export PATH=$(pwd)/bin:$(pwd)/script:$PATH
        set -o pipefail
        python3 -m pytest testsys/ -m e2e_ci -v 2>&1 | tee testRunLog.txt

    - name: Print log
      if: always()   # otherwise a failing test step hides the very log needed to debug it
      run: cat testRunLog.txt

    # Step logs need authentication to download, but annotations do not. On
    # failure, re-emit the tail of the log as annotations so the cause is
    # visible without a token.
    - name: Surface failure detail as annotations
      if: failure()
      run: |
        # GitHub caps annotations at 10 per step, so emit only decision-relevant
        # lines rather than a raw tail. Step logs need auth to download;
        # annotations do not.
        echo "::error::exit=$? lastStep; free=$(free -m | awk '/Mem:/{print $2"MB total,"$7"MB avail"}')"
        grep -nE 'FAIL|CHECK SUMMARY|STOP [0-9]|Killed|OOM|not enough slots|error while loading|Error [0-9]|cannot open|No such file' testRunLog.txt 2>/dev/null \
          | tail -n 6 | while IFS= read -r line; do echo "::error::$line"; done
        echo "::error::LASTLINE: $(tail -n 1 testRunLog.txt 2>/dev/null)"
        echo "::error::LINECOUNT: $(wc -l < testRunLog.txt 2>/dev/null)"
      
    - name: Check errors in testRunLog.txt
      run: |
        # pytest's exit code is the gate: the step above fails the job directly,
        # and set -o pipefail stops tee from masking it. The greps that used
        # to live here belonged to check.test.py, which is gone -- they looked
        # for its "CHECK SUMMARY" marker and its literal "FAIL " line. Keeping
        # them would fail on any test *named* after an error, and passing them
        # is not evidence of anything.
        #
        # What is still worth asserting is that the run produced a summary at
        # all, so a step that dies before pytest starts cannot look like a pass.
        grep -qE '[0-9]+ (passed|failed|error)' testRunLog.txt || {
          echo "pytest produced no summary line - refusing to pass."
          exit 1
        }
