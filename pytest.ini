[pytest]
testpaths = testsys
markers =
    unit: numerics checkable in-process, milliseconds, no build and no run
    contract: file formats, compset/README consistency, build and release gates
    regression: one guard per defect that actually occurred in this project
    e2e: builds the code and runs a benchmark case; minutes, opt-in
    e2e_fast: an e2e case cheap enough for the periodic/local sweep (~15 min
        total, run on the 48-64-core hosts, not per-push). Mark the cheap
        cases with BOTH e2e and e2e_fast; the long ones (a full BP5 cycle, a
        30-day BP8) with e2e only.
    e2e_ci: the subset of e2e_fast that CI itself runs on every push (owner
        decision 2026-09-23, PATHWAY_FORWARD.md row 9): two 101-step smokes,
        test.bp5.qdc.2000 and test.stepover.qdc.1000 (the project's only
        ntotft > 1 case in the gate, rule 12). Everything else in e2e_fast --
        including BP8's ~8000-step case, ~13 min alone -- runs only in the
        local sweep, never in CI.
addopts = -m "not e2e"
