# EQquasi build + run environment for MACHINE=conda-linux (see install.eqquasi.sh).
# conda env create -f environment.yml && conda activate eqquasi-petsc
# Everything, compilers and MPI included, comes from conda-forge, so the build
# is identical on every Linux host and needs no admin rights.
name: eqquasi-petsc
channels: [conda-forge]
dependencies:
  - fortran-compiler
  - c-compiler
  - cxx-compiler
  - openmpi
  - openmpi-mpifort
  - petsc=3.25.5     # conda-forge build ships MUMPS, hypre, ScaLAPACK, METIS/ParMETIS
  - netcdf-fortran
  - make
  - cmake
  - python=3.11
  - numpy=1.26
  - xarray
  - netcdf4
  - matplotlib
  - imageio
  - pytest
